<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 132" width="100%" height="100%" role="img" aria-label="Juan (Jπ) // Manifiesto"><title>Juan (Jπ) // Manifiesto</title><style>text{font-family:'JetBrains Mono','Fira Code','DejaVu Sans Mono',Consolas,'Courier New',monospace;white-space:pre}.a{fill:#6c389c}.b{fill:#a86bf0}.c{fill:#eee8f6}.d{fill:#e5b75f;font-weight:700}.e{fill:#4a1f6b}</style><rect width="960" height="132" rx="10" fill="#0d0218" stroke="#4a1f6b" stroke-width="1.5"/><rect x="10" y="10" width="940" height="112" rx="6" fill="#110320" stroke="#2e0d44"/><circle cx="26" cy="24" r="4" fill="#e5b75f"/><circle cx="38" cy="24" r="4" fill="#a86bf0"/><circle cx="50" cy="24" r="4" fill="#6c389c"/><text x="66" y="28" font-size="10.5" fill="#a86bf0">jpi@cosmos-node: ~/manifesto</text><line x1="10" y1="36" x2="950" y2="36" stroke="#2e0d44"/><text x="24" y="56" font-size="12" fill="#a86bf0">┌──(<tspan fill="#e5b75f" font-weight="700">jpi@cosmos-node</tspan>)-[<tspan fill="#eee8f6" font-weight="700">~/manifesto</tspan>]</text><text x="24" y="74" font-size="12" fill="#a86bf0">└─$ <tspan fill="#e5b75f" font-weight="700">cat identity_core.txt</tspan></text><text x="24" y="96" font-size="12" fill="#eee8f6">Soy <tspan fill="#e5b75f" font-weight="700">Juan (Jπ)</tspan>. Combino la formación en <tspan fill="#a86bf0" font-weight="700">Licenciatura en Física (UNLP)</tspan> y <tspan fill="#a86bf0" font-weight="700">Ciencia de Datos (UNLP)</tspan></text><text x="24" y="114" font-size="12" fill="#eee8f6">con el desarrollo web, mobile y visualización 3D/WebGL a través de mi estudio <tspan fill="#e5b75f" font-weight="700">Jπ Studio</tspan>. <tspan fill="#e5b75f">█<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text></svg>