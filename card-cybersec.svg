<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140421"/>
      <stop offset="100%" stop-color="#290b3d"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .radar-sweep { transform-origin: 315px 120px; animation: sweep 6s linear infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .node-pulse { fill: #e5b75f; animation: pulseNode 2.5s infinite ease-in-out; }
      @keyframes sweep { to { transform: rotate(360deg); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulseNode { 0%, 100% { r: 3.5; opacity: 0.7; } 50% { r: 5.5; opacity: 1; } }
    </style>
  </defs>

  <rect width="420" height="270" rx="12" fill="url(#cardBg3)" stroke="#4a1f6b" stroke-width="2"/>

  <rect x="12" y="12" width="396" height="24" rx="5" fill="#0e0217" stroke="#4a1f6b"/>
  <text x="24" y="28" class="mono" fill="#e5b75f" font-size="10.5" font-weight="bold">root@jpi-sec-lab:~/offsec-archive#</text>
  <text x="396" y="28" text-anchor="end" class="mono" fill="#b87aff" font-size="10">[ENCRYPTED]</text>

  <g font-size="10" class="mono">
    <text x="22" y="62" fill="#b87aff">$ ./recon_engine.sh --target=lab</text>
    <text x="22" y="82" fill="#e5b75f">[+] Enumerating network nodes...</text>
    <text x="22" y="100" fill="#d7b5ff"> ├─ PORT 443/TLS  [HARDENED]</text>
    <text x="22" y="118" fill="#d7b5ff"> ├─ PORT 22/SSH   [KEY_AUTH]</text>
    <text x="22" y="136" fill="#d7b5ff"> └─ API_GATEWAY   [AUDITED]</text>
    <text x="22" y="160" fill="#e5b75f">[+] Loading offline repo tools...</text>
    <text x="22" y="178" fill="#ffffff">&gt; status: READY<tspan class="cursor" fill="#e5b75f">_</tspan></text>
  </g>

  <circle cx="315" cy="120" r="62" fill="#0e0217" stroke="#4a1f6b" stroke-width="1.5"/>
  <circle cx="315" cy="120" r="42" fill="none" stroke="#4a1f6b" stroke-dasharray="3 3"/>
  <circle cx="315" cy="120" r="20" fill="none" stroke="#e5b75f" stroke-opacity="0.4"/>
  <line x1="253" y1="120" x2="377" y2="120" stroke="#4a1f6b" stroke-width="0.8"/>
  <line x1="315" y1="58" x2="315" y2="182" stroke="#4a1f6b" stroke-width="0.8"/>

  <line x1="315" y1="120" x2="360" y2="78" stroke="#e5b75f" stroke-width="2" class="radar-sweep"/>
  <circle cx="338" cy="95" r="4" class="node-pulse"/>
  <circle cx="290" cy="142" r="3.5" fill="#b87aff"/>
  <circle cx="335" cy="148" r="3.5" fill="#e5b75f"/>

  <rect x="18" y="205" width="384" height="48" rx="6" fill="#0e0217" stroke="#4a1f6b"/>
  <text x="30" y="224" class="mono" fill="#e5b75f" font-size="10.5">▸ OFFENSIVE SECURITY &amp; PENTESTING ARCHIVE</text>
  <text x="30" y="242" class="mono" fill="#d7b5ff" font-size="10">▸ RED TEAM LABS  |  WEB &amp; API HARDENING</text>
</svg>
